<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="126" rx="118" ry="96" fill="url(#bg)"/>
  <ellipse cx="160" cy="206" rx="82" ry="9" fill="#1D4ED8" fill-opacity="0.08"/>

  <!-- dashed loop of the plane -->
  <path d="M70 92 C 60 40, 130 30, 140 70 S 200 120, 236 58" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8"/>

  <!-- envelope -->
  <rect x="98" y="104" width="124" height="88" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
  <path d="M100 112 L160 154 L220 112" stroke="#BFDBFE" stroke-width="2" stroke-linejoin="round"/>
  <path d="M104 108 Q160 160 216 108 L160 150 Z" fill="url(#flap)" fill-opacity="0.55"/>
  <path d="M100 188 L146 148 M220 188 L174 148" stroke="#DBEAFE" stroke-width="2" stroke-linecap="round"/>

  <!-- plane -->
  <g transform="translate(232 36) rotate(-14)">
    <path d="M0 18 L44 0 L33 38 L23 25 Z" fill="url(#blue)"/>
    <path d="M23 25 L44 0 L18 22 Z" fill="#93C5FD"/>
  </g>

  <!-- z z -->
  <path d="M244 116 h12 l-12 12 h12" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M262 98 h8 l-8 8 h8" stroke="#BFDBFE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="74" cy="150" r="5" fill="#BFDBFE"/>
  <circle cx="58" cy="122" r="3" fill="#93C5FD"/>
  <path d="M254 160 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#60A5FA"/>
</svg>
