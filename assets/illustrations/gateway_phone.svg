<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <ellipse cx="180" cy="134" rx="150" ry="104" fill="url(#bg)"/>
  <ellipse cx="120" cy="236" rx="60" ry="8" fill="#1D4ED8" fill-opacity="0.1"/>

  <!-- android phone -->
  <rect x="78" y="40" width="88" height="184" rx="18" fill="#1E293B"/>
  <rect x="85" y="50" width="74" height="164" rx="12" fill="url(#screen)"/>
  <circle cx="122" cy="45" r="2.5" fill="#475569"/>
  <!-- screen content -->
  <circle cx="122" cy="102" r="24" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="122" cy="102" r="15" fill="#FFFFFF"/>
  <path d="M114 102 l6 6 l10 -11" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="98" y="138" width="48" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="104" y="150" width="36" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="96" y="176" width="52" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.18"/>
  <rect x="108" y="184" width="28" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.8"/>
  <!-- status bar -->
  <rect x="92" y="56" width="16" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>
  <path d="M140 61 h2 v-2 h2 v-2 h2 v-2 h2 v6 Z" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- signal waves -->
  <path d="M182 92 a40 40 0 0 1 0 60" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
  <path d="M198 78 a60 60 0 0 1 0 88" stroke="#93C5FD" stroke-width="5" stroke-linecap="round"/>
  <path d="M214 64 a80 80 0 0 1 0 116" stroke="#BFDBFE" stroke-width="5" stroke-linecap="round"/>

  <!-- dashed link to cloud -->
  <path d="M232 122 C 250 122, 252 100, 270 100" stroke="#1D4ED8" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/>

  <!-- cloud panel -->
  <path d="M262 112 a22 22 0 0 1 6 -43 a28 28 0 0 1 52 8 a18 18 0 0 1 -2 35 Z" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
  <rect x="280" y="84" width="26" height="18" rx="4" fill="#DBEAFE"/>
  <rect x="284" y="88" width="18" height="3" rx="1.5" fill="#1D4ED8"/>
  <rect x="284" y="94" width="12" height="3" rx="1.5" fill="#60A5FA"/>

  <!-- SIM card -->
  <g transform="translate(250 156) rotate(8)">
    <path d="M0 6 a6 6 0 0 1 6 -6 h28 l12 12 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 Z" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="9" y="18" width="26" height="22" rx="4" fill="#FCD34D"/>
    <path d="M9 29 h26 M22 18 v22" stroke="#F59E0B" stroke-width="1.6"/>
  </g>

  <!-- connected badge -->
  <circle cx="160" cy="44" r="15" fill="url(#green)" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M153 44 l5 5 l9 -9" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M44 84 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 l7 -2.5 Z" fill="#60A5FA"/>
  <circle cx="320" cy="200" r="5" fill="#BFDBFE"/>
</svg>
