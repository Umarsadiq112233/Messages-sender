<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none">
  <defs>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6FF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EAF0FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- halo rings -->
  <circle cx="240" cy="205" r="178" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="240" cy="205" r="132" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="240" cy="205" r="178" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 9"/>

  <!-- dashed flight trail -->
  <path d="M86 330 C 40 260, 120 236, 150 270 S 250 330, 300 250 S 380 90, 404 76" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10"/>

  <!-- phone shadow -->
  <rect x="172" y="58" width="150" height="304" rx="30" fill="#0B1B4D" fill-opacity="0.35"/>
  <!-- phone -->
  <rect x="165" y="48" width="150" height="304" rx="30" fill="url(#phone)"/>
  <rect x="175" y="60" width="130" height="280" rx="22" fill="url(#screen)"/>
  <rect x="216" y="67" width="48" height="9" rx="4.5" fill="#1E293B" fill-opacity="0.85"/>

  <!-- app header -->
  <rect x="183" y="84" width="114" height="38" rx="12" fill="url(#blue)"/>
  <circle cx="201" cy="103" r="10" fill="#FFFFFF" fill-opacity="0.92"/>
  <path d="M196 101 h10 M196 105 h7" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
  <rect x="217" y="95" width="52" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="217" y="106" width="34" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="284" cy="103" r="4" fill="#4ADE80"/>

  <!-- incoming bubble -->
  <rect x="185" y="134" width="84" height="36" rx="13" fill="#FFFFFF"/>
  <rect x="195" y="144" width="58" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="195" y="155" width="40" height="5" rx="2.5" fill="#E2E8F0"/>

  <!-- outgoing bubble -->
  <rect x="211" y="180" width="86" height="48" rx="13" fill="url(#blue)"/>
  <rect x="221" y="191" width="62" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="221" y="202" width="48" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.65"/>
  <path d="M266 216 l3 3 l6 -6 M272 216 l3 3 l6 -6" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- incoming bubble 2 -->
  <rect x="185" y="238" width="70" height="30" rx="12" fill="#FFFFFF"/>
  <circle cx="200" cy="253" r="3.2" fill="#94A3B8"/>
  <circle cx="211" cy="253" r="3.2" fill="#94A3B8" fill-opacity="0.7"/>
  <circle cx="222" cy="253" r="3.2" fill="#94A3B8" fill-opacity="0.45"/>

  <!-- outgoing bubble 2 -->
  <rect x="227" y="278" width="70" height="28" rx="12" fill="url(#blue)"/>
  <rect x="237" y="289" width="44" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- composer -->
  <rect x="183" y="314" width="114" height="20" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="286" cy="324" r="7" fill="url(#blue)"/>
  <path d="M283 324 h6 M287 321 l3 3 l-3 3" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- stats card (left) -->
  <rect x="40" y="112" width="138" height="104" rx="18" fill="#0B1B4D" fill-opacity="0.28" transform="translate(5 7)"/>
  <rect x="40" y="112" width="138" height="104" rx="18" fill="#FFFFFF"/>
  <rect x="56" y="128" width="54" height="7" rx="3.5" fill="#CBD5E1"/>
  <rect x="56" y="141" width="34" height="11" rx="5.5" fill="#1D4ED8"/>
  <rect x="58" y="186" width="12" height="16" rx="3" fill="#BFDBFE"/>
  <rect x="76" y="176" width="12" height="26" rx="3" fill="#93C5FD"/>
  <rect x="94" y="168" width="12" height="34" rx="3" fill="#60A5FA"/>
  <rect x="112" y="180" width="12" height="22" rx="3" fill="#93C5FD"/>
  <rect x="130" y="160" width="12" height="42" rx="3" fill="url(#blue)"/>
  <rect x="148" y="172" width="12" height="30" rx="3" fill="#60A5FA"/>
  <circle cx="160" cy="134" r="8" fill="#DCFCE7"/>
  <path d="M156 135 l3 -3 l3 2 l3 -4" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- delivered card (right) -->
  <rect x="292" y="226" width="152" height="64" rx="18" fill="#0B1B4D" fill-opacity="0.28" transform="translate(5 7)"/>
  <rect x="292" y="226" width="152" height="64" rx="18" fill="#FFFFFF"/>
  <circle cx="321" cy="258" r="16" fill="url(#green)"/>
  <path d="M313 258 l5 5 l10 -10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="346" y="246" width="80" height="7" rx="3.5" fill="#1E293B" fill-opacity="0.8"/>
  <rect x="346" y="260" width="56" height="6" rx="3" fill="#CBD5E1"/>

  <!-- queue pill (left bottom) -->
  <rect x="62" y="252" width="104" height="44" rx="22" fill="#FFFFFF"/>
  <circle cx="84" cy="274" r="12" fill="url(#amber)"/>
  <path d="M84 268 v6 l4 3" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="103" y="266" width="48" height="6" rx="3" fill="#1E293B" fill-opacity="0.75"/>
  <rect x="103" y="278" width="34" height="5" rx="2.5" fill="#CBD5E1"/>

  <!-- paper plane -->
  <g transform="translate(386 44) rotate(-10)">
    <path d="M0 26 L62 0 L46 54 L32 36 Z" fill="#FFFFFF"/>
    <path d="M32 36 L62 0 L26 31 Z" fill="#BFDBFE"/>
    <path d="M32 36 L36 50 L46 54 Z" fill="#93C5FD"/>
  </g>

  <!-- sparkles -->
  <path d="M108 70 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" fill="#FFFFFF" fill-opacity="0.85"/>
  <path d="M420 170 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#FFFFFF" fill-opacity="0.7"/>
  <path d="M352 340 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 l7 -2.5 Z" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="64" cy="200" r="4" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="440" cy="120" r="3" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="132" cy="352" r="5" fill="#FFFFFF" fill-opacity="0.35"/>
</svg>
